[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaomok"
version = "1.1.0"
description = "Production-grade Deep RL & PUCT MCTS SDK for Omok++"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "numba",
]

[project.scripts]
alphaomok = "alphaomok.cli:main"

[tool.setuptools.packages.find]
include = ["alphaomok*"]

[tool.setuptools.package-data]
alphaomok = ["models/weights/*.pt"]
